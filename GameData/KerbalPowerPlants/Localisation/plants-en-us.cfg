		//Grumble
		#LOC_KP_Grumble_title = J-9 "Grumble" Reversing Turbofan
		#LOC_KP_Grumble_description = A workhorse high-bypass turbofan wrapped in a pair of clamshell reverser buckets that might have seen better days. Deploying them turns the whole exhaust back on itself, which shortens a landing roll dramatically.


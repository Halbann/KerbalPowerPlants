/// Subcategory assignments for Kerbal Powerplants parts

/
@PART[KPZephyr]:NEEDS[VABOrganizer]
{
  %VABORGANIZER
  {
    %organizerSubcategory = rotaryProp
  }
}
ORGANIZERSUBCATEGORY
{
  name = rotaryProp
  Label = Rotary Engines
  Priority = 5
  CategoryPriority = 5
}

@PART[KPLeopard|KPPuma|KPLion|KPTiger|KPJolt]:FOR[VABOrganizer]
{
  %VABORGANIZER
  {
    %organizerSubcategory = jetEngines
  }
}

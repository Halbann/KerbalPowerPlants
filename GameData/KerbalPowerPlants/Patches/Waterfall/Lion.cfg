@PART[KPLion]:NEEDS[Waterfall]:FOR[StockWaterfallEffects]
{
	// Removes the stock effect block, and replace it with one that has no particles
	!EFFECTS {}
  	EFFECTS
	{
		fx-lion-dry-spool
		{
            AUDIO
            {
                name = soundDry1
                channel = Ship
                clip = sound_jet_low
                volume = 0.0 0.0
                volume = 0.0001 1.12
                volume = 1.0 1.32
                pitch = 0.0 0.3
                pitch = 1.0 1.0
                loop = true
            }
            AUDIO
            {
                name = soundDry2
                channel = Ship
                clip = sound_jet_deep
                volume = 0.1 0.0
                volume = 0.3 1.12
                volume = 1.0 1.25
                pitch = 0.0 0.3
                pitch = 1.0 1.0
                loop = true
            }
		}

		fx-lion-dry-power
		{
		
		}
		
		fx-lion-wet-spool
		{
            AUDIO
            {
                name = soundWet1
                channel = Ship
                clip = sound_jet_low
                volume = 0.0 0.0
                volume = 0.0001 0.65
                volume = 1.0 0.8
                pitch = 0.0 0.3
                pitch = 1.0 1.5
                loop = true
            }
            AUDIO
            {
                name = soundWet2
                channel = Ship
                clip = sound_jet_deep
                volume = 0.1 0.0
                volume = 0.3 2
                volume = 1.0 3
                pitch = 0.0 0.3
                pitch = 1.0 1.3
                loop = true
            }
		}
		
		fx-lion-wet-running
		{
            AUDIO
            {
                name = soundWet3
                channel = Ship
                clip = sound_jet_deep
                volume = 0.1 0.0
                volume = 0.3 1.12
                volume = 1.0 1.25
                pitch = 0.0 0.4
                pitch = 1.0 1.0
                loop = true
            }
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.2
				loop = false
			}
		}
		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1
				pitch = 1.8
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = flamePoint
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1
				pitch = 2.0
				loop = false
			}
		}
	}
	
	@MODULE[ModuleEngines*],0
	{
	  %powerEffectName = fx-lion-dry-power
	  %spoolEffectName = fx-lion-dry-spool
	}
	@MODULE[ModuleEngines*],1
	{
	  %runningEffectName = fx-lion-wet-running
	  %spoolEffectName = fx-lion-wet-spool
	}
	
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = lionDry
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = Dry
			responseRateUp = 0.01
			responseRateDown = 0.01
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		TEMPLATE
		{
		  templateName = stock-kerozine-turbofan-1
		  overrideParentTransform = thrustTransform
		  position = 0,0,0.45
		  rotation = 0, 0, 0
		  scale = 0.55, 0.55, 1
		}
	}
  
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = lionWet

		CONTROLLER
		{
		  name = atmosphereDepth
		  linkedTo = atmosphere_density
		}
		CONTROLLER
		{
		  name = throttle
		  linkedTo = throttle
		  engineID = Wet
		  responseRateUp = 0.0006
		  responseRateDown = 0.009
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		TEMPLATE
		{
		  templateName = kp-kerozine-afterburner-static
		  overrideParentTransform = thrustTransform
		  position = 0,0,-0.35
		  rotation = 0, 0, 0
		  scale = 0.86, 0.86, 1
		}
	}
}



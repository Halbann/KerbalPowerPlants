	// Pitch gimbal: targets SwivelProxy (driven by OpenClose anim, then
	// further perturbed by player pitch input while STOVL is engaged).
	// SwivelProxy's local X rotation feeds the bearing-swivel action constraint.
	// At deploy end, SwivelProxy sits at -90deg; the gimbal range allows it to
	// move back toward 0 on positive pitch input.
	// MODULE
	// {
	// 	name = ModuleGimbal
	// 	gimbalTransformName = SwivelProxy
	// 	actionSuffix = Pitch
	// 	gimbalRangeXP = 90
	// 	gimbalRangeXN = 0
	// 	gimbalRangeYP = 5
	// 	gimbalRangeYN = 5
	// 	useGimbalResponseSpeed = true
	// 	gimbalResponseSpeed = 1.5
	// 	flipYZ = true
	// }

	MODULE
	{
		name = ModuleGimbalTorque
		gimbalTransformName = SwivelProxy
		gimbalRangeXP = 45
		gimbalRangeXN = 0
		gimbalRangeYP = 15
		gimbalRangeYN = 15
		useGimbalResponseSpeed = true
		gimbalResponseSpeed = 2
		//flipYZ = true
		enableRoll = false
	}

	// Yaw gimbal: rotates the whole GimbalYaw subtree around its local axis.
	// MODULE
	// {
	// 	name = ModuleGimbal
	// 	gimbalTransformName = GimbalYaw
	// 	actionSuffix = Yaw
	// 	gimbalRangeXP = 0
	// 	gimbalRangeXN = 0
	// 	gimbalRangeYP = 5
	// 	gimbalRangeYN = 5
	// 	useGimbalResponseSpeed = true
	// 	gimbalResponseSpeed = 1.5
	// 	flipYZ = true
	// }

	// Action constraint: as SwivelProxy rotates 0 -> 90 around local X (deploy + gimbal pitch),
	// scrub the BearingSwivel clip 0 -> 1 (cylinder -> 90deg bend).
	MODULE
	{
		name = FXModuleConstrainAnimation
		animationName = BearingSwivel
		targetName = SwivelProxy
		axis = X
		angleMin = 0
		angleMax = -90
		animationLayer = 5
	}

	// Copy-rotation constraint: SwivelProxy's gimbal Y deflection (yaw command) is mirrored onto
	// GimbalYaw's local Z, which tilts the whole bearing chain + thrust transform to vector yaw.
	MODULE
	{
		name = FXModuleCopyRotation
		sourceName = SwivelProxy
		sourceAxis = Y
		targetName = GimbalYaw
		targetAxis = Z
		gain = 1.0
	}

	// STOVL orchestrator: plays OpenClose, gates the gimbal + constraints above. Must appear
	// AFTER the modules it manages so its OnStart runs last and the gimbal's initRot capture
	// happens cleanly, and so the constraints' authored-pose caches are taken pre-snap.
	MODULE
	{
		name = ModuleSTOVLToggle
		animationName = OpenClose
		animationLayer = 1
		deployText = Engage STOVL
		retractText = Disengage STOVL
		actionText = Toggle STOVL
		statusFieldName = STOVL
		managedGimbalTransforms = SwivelProxy
		managedConstraintAnimations = BearingSwivel
		managedCopyRotationTargets = GimbalYaw
	}


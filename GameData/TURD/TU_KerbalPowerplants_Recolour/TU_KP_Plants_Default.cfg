
// Powerplants/Parts/Leopard

@PART[KPLeopard]:FOR[000_TU_KerbalPowerplants_000]:NEEDS[TexturesUnlimited&KerbalPowerPlants]
{
	MODULE
	{
		name = KSPTextureSwitch
		sectionName = Appearance
		currentTextureSet = Stock_Default_KP_Leopard
		textureSet = Stock_Default_KP_Leopard
	}
}
+KSP_TEXTURE_SET[Stock_Default]:NEEDS[TexturesUnlimited&KerbalPowerPlants]
{
	@name = Stock_Default_KP_Leopard
	@MATERIAL
	{
		//@shader = KSP/Diffuse
		
		mesh = Petals.skin
		mesh = Bobbits
		mesh = Body
		mesh = NozzleCasing
		mesh = Nozzle
		
		texture = _MainTex,KerbalPowerPlants/Parts/Leopard/Leopard_Tex
		texture = _BumpMap,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Bump
		texture = _Emissive,KerbalPowerPlants/Parts/Leopard/Leopard_Emis
	}
}


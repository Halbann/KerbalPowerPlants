
// Powerplants/Parts/Leopard

@PART[KPLeopard]:FOR[003_TU_KerbalPowerplants_000]:NEEDS[TexturesUnlimited&KerbalPowerPlants]
{
	@MODULE[KSPTextureSwitch],0
	{
		textureSet = Stock_Paint_KP_Leopard
	}
	%MODULE[SSTURecolorGUI]
	{
		%name = SSTURecolorGUI
	}
}
+KSP_TEXTURE_SET[MWNN_Stock_Paint]:NEEDS[TexturesUnlimited&KerbalPowerPlants]
{
	@name = Stock_Paint_KP_Leopard
	@MATERIAL
	{
		mesh = Petals.skin
		mesh = Bobbits
		mesh = Body
		mesh = NozzleCasing
		mesh = Nozzle
		
		vector = _DiffuseNorm,0.74,0.6,0.5
		vector = _MetalNorm,0.45,0.35,0.25
		vector = _SmoothnessNorm,0.45,0.35,0.25
		
		texture = _MainTex,TURD/TU_KerbalPowerplants_Recolour/Leopard/Leopard_Tex
		texture = _BumpMap,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Bump
		texture = _Emissive,KerbalPowers/Plants/Parts/Leopard/Leopard_Emis
		texture = _AOMap,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Occ
		texture = _MetallicGlossMap,TURD/TU_KerbalPowerplants_Recolour/Leopard/Leopard_Spec
		texture = _MaskTex,TURD/TU_KerbalPowerplants_Recolour/Leopard/Leopard_Paint
	}
}

